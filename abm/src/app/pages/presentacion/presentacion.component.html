<fury-page-layout class="presentacion">
    <fury-breadcrumbs current="{{app.selectedMenuItem.name}}" *ngIf="false"></fury-breadcrumbs>

    <fury-page-layout-content class="padding-0">
        <mat-tab-group>
          <mat-tab label="{{app.screen.Presentacion}}" >
            <div class="padding" >
                <div class="md-card" fxLayout="column" fxLayoutAlign="end end">
                    <div class="md-card-content welcome" >
                          <p><img style="float: left; margin-right: 16px; margin-bottom: 16px;width:100%"
                              src="{{logo}}" alt="" /></p>
                    </div>
                    <div fxLayout="column" fxLayoutAlign="end end" >
                      <img src="assets/img/LOGO USS+CIENCIA Y VIDA_azul_vertical.png" class="logo"/>
                    </div>
                </div>
            </div>
          </mat-tab>
          <mat-tab label="{{app.screen.Dashboard}}" *ngIf="hasDashBoard">
            
          </mat-tab>
        </mat-tab-group>
      </fury-page-layout-content>
    
</fury-page-layout>
